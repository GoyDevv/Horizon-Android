# Every successful build of the `android` branch becomes a GitHub Release whose
# asset is the APK itself, not a ZIP: open Releases, tap the .apk, install.
# The permanent link to the newest build is
# https://github.com/<owner>/<repo>/releases/latest/download/Horizon-Android.apk
name: Android release APK
run-name: Android release · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [android]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - 'packaging/android/**'
      - 'tools/**'
      - 'mods/**'
      - 'third_party/**'
      - '.github/workflows/android-release.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      all_abis:
        description: Also attach ARMv7 and x86_64 APKs
        type: boolean
        default: false

permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Never expose the signing secret or the release permission to any other ref.
    if: github.ref == 'refs/heads/android'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Choose the APKs to build
        run: |
          if [[ "${{ inputs.all_abis }}" == "true" ]]; then
            echo 'ABIS=arm64-v8a armeabi-v7a x86_64' >> "$GITHUB_ENV"
          else
            echo 'ABIS=arm64-v8a' >> "$GITHUB_ENV"
          fi
      - name: Restore the permanent release signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          # A released APK must carry the permanent certificate, otherwise the
          # next build cannot update it in place. Fail instead of using the
          # throwaway development key.
          value = os.environ.get('KEYSTORE', '').strip()
          if not value:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is not set; see docs/android-publication.md')
          password = os.environ.get('KEYSTORE_PASSWORD', '')
          alias = os.environ.get('KEY_ALIAS', '')
          if not password or not alias:
              raise SystemExit('ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS must be set')
          path = Path('.local/android/ci.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'HORIZON_ANDROID_KEYSTORE={path.resolve()}\n')
              env.write(f'HORIZON_ANDROID_KEYSTORE_PASSWORD={password}\n')
              env.write(f'HORIZON_ANDROID_KEY_ALIAS={alias}\n')
              env.write(f'HORIZON_ANDROID_KEY_PASSWORD={os.environ.get("KEY_PASSWORD") or password}\n')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          for abi in $ABIS; do
            case "$abi" in
              arm64-v8a) target=aarch64-linux-android ;;
              armeabi-v7a) target=armv7-linux-androideabi ;;
              x86) target=i686-linux-android ;;
              x86_64) target=x86_64-linux-android ;;
            esac
            rustup target add "$target"
          done
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-release-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build the public APK
        run: |
          set -euo pipefail
          mkdir -p dist
          for ABI in $ABIS; do
            echo "::group::Build $ABI"
            python3 tools/android_build.py --abi "$ABI" --public --profile release \
              --sdk "$ANDROID_HOME" --java-home "${JAVA_HOME_17_X64:-$JAVA_HOME}" --gradle "$(command -v gradle)" \
              --ndk-version 28.2.13676358 --build-tools-version 35.0.0
            echo "::endgroup::"
            apk=".local/android/apk/$ABI/horizon-android-public.apk"
            test -f "$apk"
            # ARM64 keeps the stable name the permanent download link uses.
            if [[ "$ABI" == "arm64-v8a" ]]; then
              cp "$apk" dist/Horizon-Android.apk
            else
              cp "$apk" "dist/Horizon-Android-$ABI.apk"
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cp LICENSE dist/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
      - name: Write build metadata and release notes
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          aapt2 = os.path.join(os.environ['ANDROID_HOME'], 'build-tools/35.0.0/aapt2')
          # Read the package facts from the APK itself instead of restating the
          # Gradle defaults, which drift whenever build.gradle changes.
          badging = subprocess.check_output([aapt2, 'dump', 'badging', 'dist/Horizon-Android.apk'], text=True)
          package = re.search(r"package: name='([^']+)'", badging).group(1)
          version_code = int(re.search(r"versionCode='(\d+)'", badging).group(1))
          abis = os.environ['ABIS'].split()
          apks = sorted(p.name for p in Path('dist').glob('*.apk'))
          Path('dist/BUILD.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              'build': int(os.environ['GITHUB_RUN_NUMBER']),
              'package': package,
              'version_code': version_code,
              'profile': 'release',
              'abis': abis,
              'apks': apks,
              'public_payload_audit': 'passed in this run',
              'device_gameplay_tested': False,
          }, indent=2) + '\n', encoding='utf-8')
          listing = '\n'.join(f'- `{name}`' for name in apks)
          extra = ('\nThe other files are for older 32-bit ARM devices and x86_64 emulators or tablets.\n'
                   if len(apks) > 1 else '')
          notes = f"""Automatic build of `{os.environ['GITHUB_SHA'][:12]}` on `{os.environ['GITHUB_REF_NAME']}`.

          Direct install, no unpacking: download an APK below and open it.

          {listing}

          `Horizon-Android.apk` is the ARM64 build, which covers essentially every phone sold
          since 2017.{extra}

          Every APK is signed with the permanent release certificate and keeps the same
          `versionCode` (`{version_code}`), so installing a newer build updates the app in
          place; worlds stay.

          Compilation and the public payload audit passed. Device gameplay was not tested for this
          build: treat it as an experimental development APK, not a store release.
          """
          Path('.local/android/release-notes.md').write_text(notes, encoding='utf-8')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as handle:
              handle.write(f'### Android APK for `{os.environ["GITHUB_SHA"][:12]}`\n\n')
              handle.write('\n'.join(f'- `{name}`' for name in apks) + '\n')
          PY
      - name: Publish the release with the APK attached directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: android-${{ github.run_number }}
          TITLE: Horizon Android build ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Re-running this build replaces its own release instead of failing on
          # an existing tag. Each release keeps its APK as a plain asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          # One call, so the release never becomes visible without its assets.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file .local/android/release-notes.md --latest dist/*
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "Always newest: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Horizon-Android.apk"
      - name: Remove signing key
        if: always()
        run: rm -f .local/android/ci.keystore .local/android/debug.keystore
